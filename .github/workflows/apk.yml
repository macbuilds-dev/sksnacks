# Separate-repo workflow — every push: analyze + release APK + GitHub Release.
# Lives at repo root as .github/workflows/apk.yml on macbuilds-dev/sksnacks.
name: apk-on-push

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Avoid parallel runs racing on the same `latest` release (upload 404).
concurrency:
  group: sksnacks-apk-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write google-services.json (from secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Add repo secret GOOGLE_SERVICES_JSON_BASE64 (base64 of android/app/google-services.json). File is gitignored."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
      - name: Write upload keystore (optional — Play / proper release signing)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secrets — release APK will use debug signing (sideload OK, not Play)."
            echo "has_keystore=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties
          echo "has_keystore=true" >> "$GITHUB_ENV"
      - run: flutter analyze --no-fatal-infos
      - name: Build release APK (split per ABI — phone-sized)
        id: build
        run: |
          set -e
          # Always --release (debug fat APKs are ~150–200MB).
          # --split-per-abi → one APK per CPU; we publish arm64 (modern phones).
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "channel=release" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sksnacks-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Publish GitHub Release (APK only — we cannot remove GitHub source zips)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="${{ steps.build.outputs.apk }}"
          SIZE="${{ steps.build.outputs.size }}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN="${{ github.run_number }}"
          BUILD_TAG="build-${RUN}"
          ASSET="sksnacks-arm64-v8a-release-${BUILD_TAG}-${SHA_SHORT}.apk"
          cp "$SRC" "$ASSET"

          SIGN_NOTE="Signed with upload keystore."
          if [ "${has_keystore:-false}" != "true" ]; then
            SIGN_NOTE="Debug-signed release build (sideload / internal). Add keystore secrets for Play signing."
          fi

          NOTES="**APK:** \`${ASSET}\` (${SIZE}) — arm64-v8a release.

          ${SIGN_NOTE}

          Commit \`${SHA_SHORT}\` · run ${RUN}.

          Private repo → Releases are **not** public (collaborators only).

          Note: GitHub always attaches Source code zip/tar next to assets; that cannot be turned off. Ignore those — install only the \`.apk\`."

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          git push origin :refs/tags/latest 2>/dev/null || true

          gh release create latest "$ASSET" \
            --title "SHSnacks APK (latest · release · arm64)" \
            --notes "$NOTES" \
            --latest

          if gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            gh release upload "$BUILD_TAG" "$ASSET" --clobber
            gh release edit "$BUILD_TAG" --title "SHSnacks APK ${BUILD_TAG} (release · arm64)" --notes "$NOTES" --draft=false
          else
            gh release create "$BUILD_TAG" "$ASSET" \
              --title "SHSnacks APK ${BUILD_TAG} (release · arm64)" \
              --notes "$NOTES" \
              --latest=false
          fi
