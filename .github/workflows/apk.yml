# Separate-repo workflow — every push: analyze + APK + GitHub Release.
# Lives at repo root as .github/workflows/apk.yml on macbuilds-dev/sksnacks.
name: apk-on-push

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write google-services.json (from secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Add repo secret GOOGLE_SERVICES_JSON_BASE64 (base64 of android/app/google-services.json). File is gitignored."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json
      - run: flutter analyze --no-fatal-infos
      - name: Build APK
        id: build
        run: |
          set -e
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            flutter build apk --release
          else
            echo "channel=debug" >> "$GITHUB_OUTPUT"
            flutter build apk --debug
          fi
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: sksnacks-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Publish GitHub Releases (latest + build-N)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="${{ steps.build.outputs.apk }}"
          CHANNEL="${{ steps.build.outputs.channel }}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          NOTES="Auto APK (${CHANNEL}) from \`${SHA_SHORT}\`.

          Download the \`.apk\` asset below. (Actions Artifacts also keep a copy for ~90 days.)

          Not a Play Store listing — sideload / internal test."

          # Floating latest (sidebar "Releases" → this one)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --title "SHSnacks APK (latest · ${CHANNEL})" --notes "$NOTES"
          else
            gh release create latest "$APK" \
              --title "SHSnacks APK (latest · ${CHANNEL})" \
              --notes "$NOTES" \
              --latest
          fi

          # Immutable build tag
          BUILD_TAG="build-${{ github.run_number }}"
          gh release create "$BUILD_TAG" "$APK" \
            --title "SHSnacks APK build ${{ github.run_number }} (${CHANNEL})" \
            --notes "$NOTES" \
            --latest=false
